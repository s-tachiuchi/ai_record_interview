{% extends "admin/base.html" %}
{% block title %}パスワード変更{% endblock %}
{% block page_title %}パスワード変更{% endblock %}

{% block content %}
<div class="form-card">
  <div class="alert alert-info" data-no-autohide>
    <i class="fas fa-user-shield"></i>
    ログイン中のアカウント: <strong>{{ current_user.name }}</strong>（{{ current_user.email }}）
  </div>
  <form method="POST" action="/admin/password" autocomplete="off">
    <div class="form-section">
      <div class="form-section-title">本人確認</div>
      <div class="form-row">
        <div class="form-group">
          <label>現在のパスワード <span class="required">*</span></label>
          <input type="password" name="current_password" required autocomplete="current-password" placeholder="••••••••">
        </div>
      </div>
    </div>
    <div class="form-section">
      <div class="form-section-title">新しいパスワード</div>
      <div class="form-row">
        <div class="form-group">
          <label>新しいパスワード <span class="required">*</span></label>
          <input type="password" name="new_password" required minlength="8" autocomplete="new-password" placeholder="8文字以上">
        </div>
        <div class="form-group">
          <label>新しいパスワード（確認） <span class="required">*</span></label>
          <input type="password" name="new_password_confirm" required minlength="8" autocomplete="new-password" placeholder="同じパスワードを入力">
        </div>
      </div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary"><i class="fas fa-key"></i> 変更する</button>
      <a href="/admin/accounts" class="btn btn-outline">戻る</a>
    </div>
  </form>
</div>
{% endblock %}
