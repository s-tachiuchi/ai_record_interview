<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="av-svg" aria-hidden="true">
  <defs>
    <radialGradient id="fm-bg" cx="50%" cy="38%" r="68%">
      <stop offset="0" stop-color="#3b3a7a"/><stop offset="1" stop-color="#0f172a"/>
    </radialGradient>
    <radialGradient id="fm-skin" cx="50%" cy="34%" r="72%">
      <stop offset="0" stop-color="#ffe4cf"/><stop offset=".65" stop-color="#f5c9a6"/><stop offset="1" stop-color="#dfa683"/>
    </radialGradient>
    <linearGradient id="fm-neck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d59a76"/><stop offset="1" stop-color="#f0c19c"/>
    </linearGradient>
    <linearGradient id="fm-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2e1e"/><stop offset=".5" stop-color="#2f1c12"/><stop offset="1" stop-color="#1e120b"/>
    </linearGradient>
    <linearGradient id="fm-hair-hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5a3c" stop-opacity=".9"/><stop offset="1" stop-color="#8a5a3c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fm-jacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b4bb7"/><stop offset="1" stop-color="#2d2466"/>
    </linearGradient>
    <radialGradient id="fm-iris" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#7a4a2a"/><stop offset=".7" stop-color="#3b2314"/><stop offset="1" stop-color="#1c0f08"/>
    </radialGradient>
    <linearGradient id="fm-lip-u" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c55f6b"/><stop offset="1" stop-color="#a94a56"/>
    </linearGradient>
    <linearGradient id="fm-lip-l" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8848e"/><stop offset="1" stop-color="#c85c68"/>
    </linearGradient>
    <clipPath id="fm-eye-l"><path d="M69,98 Q82,87 95,98 Q82,107 69,98 Z"/></clipPath>
    <clipPath id="fm-eye-r"><path d="M105,98 Q118,87 131,98 Q118,107 105,98 Z"/></clipPath>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#fm-bg)"/>

  <!-- 後ろ髪 -->
  <path d="M50,96 C48,50 70,34 100,34 C130,34 152,50 150,96 L156,174 C130,184 70,184 44,174 Z" fill="url(#fm-hair)"/>

  <!-- 上着 -->
  <path d="M32,200 C38,162 64,152 84,150 L100,166 L116,150 C136,152 162,162 168,200 Z" fill="url(#fm-jacket)"/>
  <path d="M84,150 L100,172 L116,150 L109,166 L100,164 L91,166 Z" fill="#fbfbfb"/>
  <path d="M84,150 L100,172 L100,200 L70,200 C64,180 70,160 84,150 Z" fill="#000" opacity=".12"/>

  <!-- 首 -->
  <path d="M86,138 L86,160 Q100,168 114,160 L114,138 Q100,150 86,138 Z" fill="url(#fm-neck)"/>
  <path d="M86,138 Q100,150 114,138 L114,146 Q100,156 86,146 Z" fill="#000" opacity=".16"/>

  <!-- 耳 -->
  <ellipse cx="61" cy="103" rx="6.5" ry="9.5" fill="#e9b894"/>
  <path d="M60,98 Q56,104 61,108" stroke="#c98c68" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <ellipse cx="139" cy="103" rx="6.5" ry="9.5" fill="#e9b894"/>
  <path d="M140,98 Q144,104 139,108" stroke="#c98c68" stroke-width="1.4" fill="none" stroke-linecap="round"/>

  <!-- 顔 -->
  <path d="M62,86 C62,56 80,44 100,44 C120,44 138,56 138,86 C139,110 132,130 118,142 C110,149 90,149 82,142 C68,130 61,110 62,86 Z" fill="url(#fm-skin)"/>
  <!-- 顔の輪郭の影 -->
  <path d="M118,142 C132,130 139,110 138,86 C138,100 134,122 124,134 C120,139 116,142 118,142 Z" fill="#000" opacity=".07"/>
  <path d="M82,142 C68,130 61,110 62,86 C62,100 66,122 76,134 C80,139 84,142 82,142 Z" fill="#000" opacity=".07"/>

  <!-- 頬 -->
  <ellipse cx="74" cy="115" rx="10" ry="5.5" fill="#f08a96" opacity=".28"/>
  <ellipse cx="126" cy="115" rx="10" ry="5.5" fill="#f08a96" opacity=".28"/>

  <!-- 眉 -->
  <path d="M70,88 C74,82 84,80 95,85 C86,84 76,86 71,91 Z" fill="#3a2416"/>
  <path d="M130,88 C126,82 116,80 105,85 C114,84 124,86 129,91 Z" fill="#3a2416"/>

  <!-- 目（左） -->
  <g class="av-eye">
    <path d="M69,98 Q82,87 95,98 Q82,107 69,98 Z" fill="#fff"/>
    <g clip-path="url(#fm-eye-l)">
      <circle cx="83" cy="98.5" r="6.8" fill="url(#fm-iris)"/>
      <circle cx="83" cy="98.5" r="3" fill="#0b0604"/>
      <circle cx="85.4" cy="96" r="1.9" fill="#fff"/>
      <circle cx="81" cy="101" r=".9" fill="#fff" opacity=".7"/>
      <path d="M69,98 Q82,87 95,98 Q82,92 69,98 Z" fill="#000" opacity=".12"/>
    </g>
    <path d="M69,98 Q82,86 95,97.5" stroke="#2a180f" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M71,95 L67.5,92" stroke="#2a180f" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M72,102 Q82,107 93,101" stroke="#b07a5c" stroke-width=".9" fill="none" opacity=".7"/>
  </g>
  <!-- 目（右） -->
  <g class="av-eye">
    <path d="M105,98 Q118,87 131,98 Q118,107 105,98 Z" fill="#fff"/>
    <g clip-path="url(#fm-eye-r)">
      <circle cx="117" cy="98.5" r="6.8" fill="url(#fm-iris)"/>
      <circle cx="117" cy="98.5" r="3" fill="#0b0604"/>
      <circle cx="119.4" cy="96" r="1.9" fill="#fff"/>
      <circle cx="115" cy="101" r=".9" fill="#fff" opacity=".7"/>
      <path d="M105,98 Q118,87 131,98 Q118,92 105,98 Z" fill="#000" opacity=".12"/>
    </g>
    <path d="M105,97.5 Q118,86 131,98" stroke="#2a180f" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M129,95 L132.5,92" stroke="#2a180f" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M107,101 Q118,107 128,102" stroke="#b07a5c" stroke-width=".9" fill="none" opacity=".7"/>
  </g>

  <!-- 鼻 -->
  <path d="M97,104 C94,110 93,116 96,119 Q100,121 104,119 C107,116 106,110 103,104" stroke="#c98a66" stroke-width="1.2" fill="none" opacity=".55" stroke-linecap="round"/>
  <ellipse cx="96.5" cy="118.5" rx="1.6" ry="1" fill="#b5764f" opacity=".5"/>
  <ellipse cx="103.5" cy="118.5" rx="1.6" ry="1" fill="#b5764f" opacity=".5"/>

  <!-- 唇 -->
  <path d="M87,128 Q93,123.5 100,126.5 Q107,123.5 113,128 Q100,131 87,128 Z" fill="url(#fm-lip-u)"/>
  <path d="M87,128 Q100,140 113,128 Q100,132 87,128 Z" fill="url(#fm-lip-l)"/>
  <path d="M93,133 Q100,136 107,133" stroke="#fff" stroke-width="1" fill="none" opacity=".35"/>
  <!-- 口の開き（アニメーション対象） -->
  <path id="av-mouth" d="M89,128 Q100,129.5 111,128 Q100,130 89,128 Z"
        data-closed="M89,128 Q100,129.5 111,128 Q100,130 89,128 Z"
        data-open="M90,127 Q100,128.5 110,127 Q109,140 100,142 Q91,140 90,127 Z"
        fill="#4a1a20"/>

  <!-- 前髪 -->
  <path d="M60,94 C58,56 76,40 100,40 C124,40 142,56 140,94 C136,72 120,64 104,66 C96,56 84,60 78,72 C70,74 64,82 60,94 Z" fill="url(#fm-hair)"/>
  <path d="M84,52 C92,46 106,46 116,52 C108,50 96,50 84,52 Z" fill="url(#fm-hair-hi)"/>
  <path d="M70,80 C76,64 90,56 104,58" stroke="#7a4f34" stroke-width="1.6" fill="none" opacity=".55" stroke-linecap="round"/>
  <path d="M112,60 C122,64 130,72 134,84" stroke="#7a4f34" stroke-width="1.4" fill="none" opacity=".45" stroke-linecap="round"/>

  <!-- 横の髪 -->
  <path d="M58,92 C52,120 52,150 58,172 C64,148 64,116 66,96 Z" fill="url(#fm-hair)"/>
  <path d="M142,92 C148,120 148,150 142,172 C136,148 136,116 134,96 Z" fill="url(#fm-hair)"/>
  <path d="M60,104 C57,126 57,150 60,166" stroke="#8a5a3c" stroke-width="1.2" fill="none" opacity=".45"/>
  <path d="M140,104 C143,126 143,150 140,166" stroke="#8a5a3c" stroke-width="1.2" fill="none" opacity=".45"/>
</svg>
