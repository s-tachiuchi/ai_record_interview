<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="av-svg" aria-hidden="true">
  <defs>
    <linearGradient id="rb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#rb-bg)"/>
  <!-- アンテナ -->
  <rect x="96" y="30" width="8" height="22" rx="4" fill="#cbd5e1"/>
  <circle cx="100" cy="28" r="9" fill="#f59e0b"/>
  <!-- 頭 -->
  <rect x="42" y="52" width="116" height="96" rx="24" fill="#e2e8f0"/>
  <rect x="52" y="62" width="96" height="76" rx="18" fill="#1e293b"/>
  <!-- 耳 -->
  <rect x="30" y="86" width="12" height="28" rx="6" fill="#94a3b8"/>
  <rect x="158" y="86" width="12" height="28" rx="6" fill="#94a3b8"/>
  <!-- 目 -->
  <g class="av-eye"><ellipse cx="78" cy="92" rx="11" ry="12" fill="#60a5fa"/><circle cx="81" cy="88" r="3.5" fill="#fff"/></g>
  <g class="av-eye"><ellipse cx="122" cy="92" rx="11" ry="12" fill="#60a5fa"/><circle cx="125" cy="88" r="3.5" fill="#fff"/></g>
  <!-- 口 -->
  <path id="av-mouth" d="M80,120 Q100,126 120,120"
        data-closed="M80,120 Q100,126 120,120" data-open="M80,116 Q100,136 120,116"
        stroke="#60a5fa" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- 首・胴 -->
  <rect x="86" y="148" width="28" height="14" fill="#94a3b8"/>
  <rect x="60" y="160" width="80" height="40" rx="14" fill="#cbd5e1"/>
</svg>
